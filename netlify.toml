#  JusticeCenterID — Netlify configuration
#
#  NOT DEPLOYED. This file is committed configuration only; no Netlify site has been
#  created, linked, or deployed. See docs/deployment/netlify-strategy.md for the full
#  strategy and the pre-connection checklist.
#
#  Deployment model: Next.js static export. `next build` writes `out/`, which Netlify
#  publishes directly. @netlify/plugin-nextjs is intentionally NOT installed — it adapts
#  Next.js into Netlify Functions, which conflicts with a fully exported build.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Next has already produced final hashed, minified assets. Post-processing them adds
# nothing and risks breaking asset integrity.
[build.processing]
  skip_processing = true

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------
# Canonical host is the apex. Slug-change redirects are added here in the same commit
# as the slug change, and are never removed.

[[redirects]]
  from = "https://www.justicecenterid.com/*"
  to = "https://justicecenterid.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# `headers()` in next.config.ts is ignored under static export, so security headers are
# declared here. The CSP is tight because the site loads nothing from a third party: no
# font CDN, no analytics, no embeds.
#
# script-src MUST retain 'unsafe-inline'. This is not an oversight — it is forced by the
# rendering model, and omitting it breaks the deployed site:
#
#   Next.js App Router inlines its bootstrap and RSC flight payload into every prerendered
#   page as `<script>self.__next_f.push(...)</script>`. A production build emits 17 such
#   inline scripts on the home page alone. Under `output: 'export'` there is no server to
#   mint a per-request nonce, and the payload is build-specific, so subresource hashes
#   would change on every build and silently begin blocking hydration.
#
#   With `script-src 'self'` alone the browser blocks all of them: React never hydrates,
#   the mobile navigation panel is dead, and the console fills with CSP violations. The
#   prerendered HTML still renders and every link still works, so the failure is silent —
#   which is exactly why it survived the original build and 96 green E2E tests.
#
# The residual risk is bounded: the site accepts no user input, renders nothing from query
# parameters, embeds no third-party script, and produces no dynamic HTML, so there is no
# injection path for 'unsafe-inline' to widen. object-src 'none', base-uri 'self',
# form-action 'self' and frame-ancestors 'none' all remain.
#
# Reversal criterion: if the project moves off `output: 'export'` onto the Netlify Next.js
# runtime, switch to nonce-based script-src and drop 'unsafe-inline'.
#
# tests/unit/csp.test.ts asserts this directive against the inline scripts the build
# actually emits, so the two cannot drift apart again.
#
# Strict-Transport-Security is deliberately NOT set yet. It should be enabled only after
# the domain is live and confirmed HTTPS-only.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
